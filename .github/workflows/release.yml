name: Create Release

# main へ PR がマージされたら、プラグインのルートファイルのバージョンでリリースを作成する。
# 同じバージョンのリリース（タグ）が既にある場合はリリースをスキップする。
# リリースの有無にかかわらず、最後に main → dev の反映 PR を作成する。

on:
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PLUGIN_FILE: ruijinen-block-patterns-r001-corp.php
      # プラグインのディレクトリー名（zip のトップレベルのディレクトリー名）
      PLUGIN_SLUG: ruijinen-block-patterns-r001-corp
      ZIP_NAME: ruijinen-block-patterns-r001-corp.zip
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Get plugin version
        id: version
        run: |
          version="$(sed -n 's/^[[:space:]]*\*[[:space:]]*Version:[[:space:]]*//p' "$PLUGIN_FILE" | head -n 1 | tr -d '\r[:space:]')"
          if ! [[ "$version" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            echo "::error file=$PLUGIN_FILE::プラグインヘッダーから Version を取得できませんでした（取得値: '$version'）"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

      - name: Check existing release
        id: check
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$VERSION" > /dev/null 2>&1 || git rev-parse -q --verify "refs/tags/$VERSION" > /dev/null; then
            echo "::notice::バージョン $VERSION のリリースは既に存在するため、リリースをスキップします"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.check.outputs.exists == 'false'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Build assets
        if: steps.check.outputs.exists == 'false'
        run: |
          npm ci
          npm run build

      - name: Composer install
        if: steps.check.outputs.exists == 'false'
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Create zip
        if: steps.check.outputs.exists == 'false'
        run: |
          # zip のトップレベルをプラグインのディレクトリー（$PLUGIN_SLUG/）にする。
          # トップレベルにファイルを直接置くと、WordPress の更新時に作業ディレクトリー名
          # （例: ruijinen-block-patterns-r001-corp-51sVCH4sqMeONYtI）がそのままプラグインのディレクトリー名になってしまう。
          stage="$RUNNER_TEMP/stage"
          mkdir -p "$stage/$PLUGIN_SLUG"
          # 配布に不要な開発用ファイルを除外してコピーする（先頭の / はリポジトリのルート直下のみに一致）
          rsync -a ./ "$stage/$PLUGIN_SLUG/" \
            --exclude='/.git/' --exclude='/.github/' --exclude='/.gitignore' --exclude='/.editorconfig' \
            --exclude='/.nvmrc' --exclude='/.wp-env.json' --exclude='.DS_Store' \
            --exclude='/.export/' --exclude='/node_modules/' --exclude='/src/' --exclude='/tests/' \
            --exclude='/package.json' --exclude='/package-lock.json' --exclude='/postcss.config.js' \
            --exclude='/optimize-images.mjs' --exclude='/composer.json' --exclude='/composer.lock'
          (cd "$stage" && zip -rq "$RUNNER_TEMP/$ZIP_NAME" "$PLUGIN_SLUG")

          # トップレベルが $PLUGIN_SLUG/ だけで、その直下にプラグインのルートファイルがあることを確認する
          top="$(zipinfo -1 "$RUNNER_TEMP/$ZIP_NAME" | cut -d/ -f1 | sort -u)"
          if [ "$top" != "$PLUGIN_SLUG" ] || ! zipinfo -1 "$RUNNER_TEMP/$ZIP_NAME" | grep -qx "$PLUGIN_SLUG/$PLUGIN_FILE"; then
            echo "::error::zip の構成が不正です（トップレベル: $(echo "$top" | tr '\n' ' ')）"
            exit 1
          fi
          unzip -l "$RUNNER_TEMP/$ZIP_NAME" | tail -n 1

      - name: Create release
        if: steps.check.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TARGET_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ -n "$PR_BODY" ]; then
            printf '%s\n' "$PR_BODY" > "$RUNNER_TEMP/notes.md"
          else
            echo "- バージョン $VERSION" > "$RUNNER_TEMP/notes.md"
          fi
          gh release create "$VERSION" "$RUNNER_TEMP/$ZIP_NAME" \
            --target "$TARGET_SHA" \
            --title "$VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md"

      - name: Create pull request (main → dev)
        run: |
          git fetch origin main dev
          if [ "$(git rev-list --count origin/dev..origin/main)" -eq 0 ]; then
            echo "dev に未反映のコミットがないため、反映 PR の作成をスキップします"
            exit 0
          fi
          if [ -n "$(gh pr list --base dev --head main --state open --json number -q '.[0].number')" ]; then
            echo "main → dev の反映 PR は既に存在します"
            exit 0
          fi
          gh pr create --base dev --head main \
            --title "リリース残処理：mainの内容をdevへ反映" \
            --body "main の内容を dev へ反映します。"
